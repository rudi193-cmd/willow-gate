[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "willow-gate"
version = "0.1.0"
description = "Minimalist symmetric check-in/check-out gate: trust-tiered access, announce-loud-for-the-untrusted, PGP-encrypted ledger, hard stops."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sean Campbell" }]
dependencies = ["python-gnupg>=0.5", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/willow_gate"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# The test suite deliberately uses compact one-line setup statements
# (`ev = dict(e); ev["seq"] = i`) and short loop names; don't fight it.
"tests/*" = ["E702", "E741"]

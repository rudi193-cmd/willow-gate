name: Tests

on:
  push:
    # Both names: the fleet is split between `main` and `master`, and a
    # single-name filter turns a default-branch rename into a silently dead
    # push trigger. Same hedge dependabot-automerge.yml already carries.
    branches: [main, master]
  pull_request:
  schedule:
    # Daily drift catcher, off the :00/:30 peak-load minutes — same reasoning
    # as willow-mcp's: this repo goes quiet between changes, and a new Python
    # point release or python-gnupg/gpg bump should not wait for the next
    # push to surface.
    - cron: "37 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: pip install ruff==0.15.0 bandit

      - name: Ruff (enforced)
        run: ruff check src tests

      - name: Bandit (enforced — tree is clean, keep it that way)
        run: bandit -r src -ll -q

  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor and current for requires-python >= 3.10.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]" coverage

      - name: Run tests (under coverage)
        # python-gnupg wraps the gpg binary; ubuntu runners ship it.
        run: |
          coverage run --include='src/willow_gate/*' -m pytest tests/ -q
          # Floor, not target: measured 94.1% on master. Ratchet up, never down.
          coverage report --fail-under=90

  # Aggregate gate: branch protection requires a single check named "test"
  # across the whole fleet. Green only when lint and every matrix leg are.
  test:
    needs: [test-matrix, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint and all matrix legs green"
